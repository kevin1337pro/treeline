  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif; }
    body { background: #f8f7f4; color: #1a1a18; }
    #root { height: 100%; }
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #ddd; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #bbb; }
    button, input, select, textarea { font-family: inherit; }
    .mapboxgl-map { font-family: inherit; }
    .mobile-label { display: none; }

    /* Mobile responsive */
    @media (max-width: 768px) {
      html, body, #root {
        width: 100% !important;
        max-width: 100% !important;
        overflow-x: hidden !important;
      }
      .sidebar-desktop {
        top: 52px !important;
        height: calc(100vh - 52px) !important;
        transform: translateX(-100%);
        box-shadow: 12px 0 30px rgba(0,0,0,0.14);
      }
      .sidebar-desktop.sidebar-open { transform: translateX(0); }
      .sidebar-desktop.sidebar-collapsed { transform: translateX(-100%); }
      .main-content {
        margin-left: 0 !important;
        width: 100% !important;
        max-width: 100vw !important;
        overflow-x: hidden !important;
      }
      .stat-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr)) !important;
        width: 100% !important;
        max-width: 100% !important;
      }
      .stat-grid > * {
        min-width: 0 !important;
      }
      .row3 { grid-template-columns: 1fr !important; }
      .two-col { grid-template-columns: 1fr !important; }
      .meta-grid { grid-template-columns: repeat(2, 1fr) !important; }
      .kanban { grid-template-columns: 1fr !important; }
      .dashboard-page {
        padding: 20px 14px 28px !important;
        max-width: 100vw !important;
        overflow-x: hidden !important;
      }
      .dashboard-page svg {
        max-width: 100% !important;
      }
      .table-scroll {
        overflow-x: auto !important;
        -webkit-overflow-scrolling: touch;
      }
      .table-scroll table {
        min-width: 720px !important;
      }
      .app-top-bar {
        padding: 0 10px !important;
      }
      .app-top-right {
        gap: 6px !important;
      }
      .global-search {
        display: none !important;
      }
      .desktop-label {
        display: none !important;
      }
      .mobile-label {
        display: inline !important;
      }
      .orders-shell {
        height: auto !important;
        min-height: 100% !important;
        overflow: visible !important;
        flex-direction: column !important;
        max-width: 100vw !important;
      }
      .orders-list {
        width: 100% !important;
        min-width: 0 !important;
        max-width: 100% !important;
        height: auto !important;
        max-height: 42vh !important;
        border-right: none !important;
        border-bottom: 1px solid #e5e5e0 !important;
      }
      .orders-detail {
        padding: 16px !important;
        overflow: visible !important;
        min-width: 0 !important;
        max-width: 100vw !important;
      }
      .orders-detail > * {
        min-width: 0 !important;
      }
      .orders-detail h1 {
        font-size: 22px !important;
      }
    }
  </style>
